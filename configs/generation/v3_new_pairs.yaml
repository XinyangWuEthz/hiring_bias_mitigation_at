# Hand-written -- NOT produced by generate_experiment_configs.py, so it survives a regeneration.
#
# V3 round 3 (docs/V3_NEW_DATA.md): the first round's construction on further parts of the same
# pool, for on-policy DPO pairs only. SFT-v3 trained on every pair the first round drew, and
# errs on them on 1.2% of its samples; on its held-out candidates its tipped mistakes per row
# run 1.4 to 5.7 times higher. These parts are pairs it never saw. Against
# v3_additional_data.yaml three things change, and the rest is copied unchanged:
#   artifacts_dir   its own directory, so the first round's outputs, SFT-v3's training data
#                   among them, stay as built
#   pool_dir        the first round's pool: the same parts and the same seeded validation split
#   earlier_rounds  the first round's directory: its parts are refused, and `assemble` refuses
#                   a candidate in its sft_* files
# `assemble` also writes this round's SFT views beside the on-policy input; nothing trains on
# them. Only `raw/en_invariant.parquet` and `sft_validation.parquet` (whose candidates the
# on-policy build holds out) are read, by negatives_v3_onpolicy_new_gh200.yaml. No biased pass:
#   HBM_COST_ARM=dpo_v3_5k REPO=$PWD CFG=configs/generation/v3_new_pairs.yaml PASSES="votes invariant" \
#     scripts/cscs/submit.sh -t 02:00:00 scripts/cscs/v3_additional_data.sbatch djinni_new-003 rjdb-002
#   python scripts/v3_additional_data.py --config configs/generation/v3_new_pairs.yaml --stage assemble
artifacts_dir: artifacts/semisynthetic-v3/new-pairs
pool_dir: artifacts/semisynthetic-v3/additional/pool
earlier_rounds:
- artifacts/semisynthetic-v3/additional
lang: en
seed: 42

pool:
  # V1's English pairs: not generated; new pairs must not repeat their candidates or texts.
  v1_reference: artifacts/semisynthetic-v1/raw/en_reference.parquet
  djinni_new:
    n_pairs: 200000         # more than exist: every candidate V1 did not use, one job each
    seed: 4242              # not V1's 42, so the order is not V1's continued
  external:
    seed: 42
    jobs_per_candidate: 2   # kaggle_linkedin: two LinkedIn JDs per Kaggle CV
    rjdb_include_weakened: false
    pairs_per_source:       # more than exist: every eligible pair
      rjdb: 60000
      kaggle_linkedin: 4000
  # max_model_len 8192 minus 320 new tokens and a chat-template margin. The invariant prompt
  # adds the injected attribute, the quoted anchor and its instructions to the reference prompt.
  max_prompt_tokens: 7600
  invariant_overhead_tokens: 300

# v1's variant grid (configs/generation/teacher.yaml): 3 groups x 2 attributes x 2 conditions.
protected_groups: [military_status, gender, religion]
conditions: [explicit, implicit]
attributes_per_pair: 2

generate:
  part_size: 1500           # about 9 min of votes and 13 min per variant pass at Daint's rates

vote_draws: 8
passes:
  votes:                    # v1's anchor decoding; base seed 43, as the Djinni vote (job 5073453)
    max_new_tokens: 320
    temperature: 0.7
    top_p: 0.9
    seed: 43
  invariant:                # v1's decoding; per-prompt seed 42, as the vote targets (job 5103710)
    max_new_tokens: 320
    temperature: 0.7
    top_p: 0.9
    seed: 42
  biased:
    max_new_tokens: 320
    temperature: 0.7
    top_p: 0.9
    seed: 42

# docs/V3_NEW_DATA.md's stop conditions, read on each source's first part in a job; a source that
# crosses one gets no further part in that job.
stop:
  max_undecided_draw_share: 0.05
  max_unanchored_share: 0.10
  min_invariant_yield: 0.80
  min_biased_yield: 0.20

split:
  val_fraction: 0.05        # of each source's candidates; none of them is a V1 candidate

assemble:
  # The new SFT rows are appended to this set, which stays exactly as built.
  sft_v3_dir: artifacts/semisynthetic-v3/sft_v3_swap
  # Teacher-biased DPO (v1's negatives, D3 = 1.000) is ruled out for training (user,
  # 2026-10-20); true writes it as teacher_biased_* for comparison only. DPO for training is
  # r2em (r2em: below) plus on-policy pairs from scripts/generate_onpolicy_full.py, which reads
  # this directory's raw/en_invariant.parquet.
  teacher_biased_dpo: false
  # The teacher-biased views: at most this many rows per pool pair, and the same with hire and
  # reject equal within each pool source.
  dpo_cap_per_pair: 2
  # Pairs dropped at assembly on their CV (scripts/v3_additional_data.py quality_exclusions).
  exclude:
    djinni_new_extra_markers: true   # names, pronouns, maternity leave: V1's list misses them
    rjdb_template_residue: true      # "Details not provided", "[insert ...]"

teacher_model: Qwen/Qwen3.5-122B-A10B-GPTQ-Int4
serving:                    # the vote and judge runs' serving on a GH200 node
  backend: vllm
  tensor_parallel_size: 4
  gpu_memory_utilization: 0.80
  max_model_len: 8192
  max_num_seqs: 128
  dtype: auto
  engine_kwargs:
    gdn_prefill_backend: triton
