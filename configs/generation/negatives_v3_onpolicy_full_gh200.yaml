# Hand-written -- NOT produced by generate_experiment_configs.py, so it survives a regeneration.
#
# V3's on-policy DPO pairs (docs/V3_NEW_DATA.md, round 2): r2em's construction on the
# v3 pipeline's new English pairs, with SFT-v3 as the student. `rejected` is SFT-v3's own covert,
# attribute-tipped mistake, judged by the teacher; `chosen` is the invariant text written on the
# 8-draw vote anchor. The pool is raw/en_invariant.parquet: 102,660 rows over 8,555 pairs, of
# which v1's invariant filter keeps 102,465 rows over 8,549 pairs (djinni_new 4,267, rjdb 2,778,
# kaggle_linkedin 1,504; 32% hire), so 111,014 prompts and 888,112 samples. Against
# negatives_v2_onpolicy_full_gh200.yaml only the source, the output, the student and the split
# change. The k=32 hire top-up is negatives_v3_onpolicy_hire_gh200.yaml.
# Costs are recorded under the arm dpo_v3, with every job of V3's DPO data (docs/COST.md):
#   HBM_COST_ARM=dpo_v3 REPO=$PWD CONFIG=configs/generation/negatives_v3_onpolicy_full_gh200.yaml \
#     scripts/cscs/submit.sh -p normal -t 03:00:00 scripts/cscs/onpolicy_full.sbatch sample
#   HBM_COST_ARM=dpo_v3 REPO=$PWD CONFIG=... scripts/cscs/submit.sh -p normal -t 02:00:00 \
#     scripts/cscs/onpolicy_full.sbatch judge
source_artifacts_dir: artifacts/semisynthetic-v3/additional
artifacts_dir: artifacts/semisynthetic-v3/onpolicy-full
lang: en
seed: 42
# Hold out exactly the candidates sft_validation.parquet holds out: SFT-v3's validation
# (generate_onpolicy_full.validation_ids). v1's 0.05 would also hold out a seeded 5% of the
# candidates SFT-v3 trained on.
val_fraction: 0

student_base: Qwen/Qwen3.5-9B
# SFT-v3 on all new data, one epoch, its final adapter
# (configs/mitigation/sft/qwen3.5-9b_en_only_sft_v3_additional_gh200.yaml); merged into the base
# for vLLM under outputs/merged/.
student_adapter: outputs/sft/qwen3.5-9b_en_only_sft_v3_additional
samples_per_prompt: 8
min_free_right: 0.5
# 512 prompts x 8 samples is about a minute and a half per GPU: the most a job cut by the
# time limit can lose.
chunk_size: 512
student_vllm:
  gpu_memory_utilization: 0.70      # of 95.6 GiB usable; anything near 96 GB OOMs
  max_model_len: 8192
  max_num_seqs: 256                 # 32 prompts x 8 samples in flight
  engine_kwargs:
    gdn_prefill_backend: triton     # no CUDA toolkit on Daint for FlashInfer's JIT
student_generation:
  max_new_tokens: 200
  temperature: 1.0
  top_p: 1.0
  seed: 42

judge_strategies:
- student_tipped
max_length_delta_words: 10
min_plausibility: 3
n_samples: 20

# The teacher, as judge only -- the same settings as onpolicy-full and batch-01.
teacher_model: Qwen/Qwen3.5-122B-A10B-GPTQ-Int4
backend: vllm
dtype: auto
max_model_len: 8192
tensor_parallel_size: 4
gpu_memory_utilization: 0.80
max_num_seqs: 128
engine_kwargs:
  gdn_prefill_backend: triton
judge_generation:
  max_new_tokens: 160
  temperature: 0.0
  top_p: 1.0
