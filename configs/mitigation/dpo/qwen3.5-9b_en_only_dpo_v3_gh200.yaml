# Hand-written -- NOT produced by generate_experiment_configs.py, so it survives a regeneration.
#
# DPO-v3: SFT-v3 -> DPO on V3's DPO set (user, 2026-10-21: "start DPO with all data we got so far
# from sftV3"). The data is configs/data/en_only_dpo_v3.yaml: r2em_v3's 2,271 pairs followed by
# 1,568 on-policy pairs drawn from SFT-v3 and balanced by error mass within each pool source, with
# 442 validation pairs (docs/V3_NEW_DATA.md, round 2). The training settings are r2em's
# (qwen3.5-9b_en_only_dpo_v2neg_r2em_gh200.yaml): beta 0.3, sigmoid plus 0.2 NLL on chosen,
# lr 5e-5, 10 warmup steps, effective batch 16, one epoch. Against r2em, four things change:
#   sft_checkpoint  SFT-v3 (outputs/sft/qwen3.5-9b_en_only_sft_v3_additional, job 5107673); it
#                   is merged into the base, and with the LoRA disabled it is the reference model
#   data            dpo_v3: 3,839 pairs, so 240 steps
#   max_seq_len     3072. TRL 1.15 has no max_prompt_length and cuts a row at max_length from the
#                   end (truncation_mode keep_start), which would cut the responses of the longest
#                   Kaggle x LinkedIn rows: 21 training and 10 validation rows exceed 2048, the
#                   longest is 2,466 tokens (reports/v3_new_data/dpo_token_lengths.json)
#   output, W&B run name
# The final checkpoint, step 240, is the one audited, declared before training. A checkpoint is
# saved every 25 steps and all are kept, so a cut job resumes.
#   HBM_COST_ARM=dpo_v3 REPO=$PWD \
#   CONFIG=configs/mitigation/dpo/qwen3.5-9b_en_only_dpo_v3_gh200.yaml \
#     scripts/cscs/submit.sh -p normal -t 02:00:00 scripts/cscs/train_dpo.sbatch
stage: dpo
objective: dpo
data_kind: dpo_v3
base_model: Qwen/Qwen3.5-9B
sft_checkpoint: outputs/sft/qwen3.5-9b_en_only_sft_v3_additional
data_config: configs/data/en_only_dpo_v3.yaml
output_dir: outputs/dpo/qwen3.5-9b_en_only_dpo_v3
use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
beta: 0.3                      # as r2em
loss_type:
- sigmoid
- sft
loss_weights:
- 1.0
- 0.2
# false under torchrun: TRL's precompute cache is per-process for in-memory datasets
# (job 5054142). The reference pass runs every step instead.
precompute_ref_log_probs: false
max_seq_len: 3072
max_prompt_len: 2944           # read only by a TRL that still has max_prompt_length
num_train_epochs: 1
max_steps: -1                  # one epoch
warmup_steps: 10
learning_rate: 5.0e-05
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 4        # x 4 GPUs x batch 1 = 16
gradient_checkpointing: true
weight_decay: 0.01
dtype: bfloat16
seed: 42
eval_steps: 25
eval_limit_rows: 200
early_stopping_patience: 0
memory_floor_gb: 12
wandb_project: hiring-bias-mitigation
wandb_run_name: dpo-qwen3.5-9b_en_only_dpo_v3
# Greedy decisions on 64 validation prompts after every eval: the hire rate on reference-hire
# prompts is what fell in round 1.
decision_eval_rows: 64
resume: true
save_steps: 25
save_total_limit: 20
load_best_model_at_end: false
ddp_find_unused_parameters: false
gradient_checkpointing_kwargs:
  use_reentrant: false
