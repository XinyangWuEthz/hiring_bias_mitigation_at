# Hand-written -- NOT produced by generate_experiment_configs.py, so it survives a regeneration.
#
# DPO-v3 on the on-policy pairs alone (user, 2026-10-21: "只用 on-policy 的 1,568 对做 DPO，然后评测").
# DPO-v3 (qwen3.5-9b_en_only_dpo_v3_gh200.yaml) was not better than SFT-v3: +0.94 pp unstable
# sets at matched hire rate, [-0.26, +2.24] (job 5114015). 59% of its rows were r2em_v3,
# sampled from SFT v1. This run drops them and keeps everything else, so the two runs differ in
# the data only:
#   data   configs/data/en_only_dpo_v3_onpolicy.yaml: 1,568 training and 170 validation pairs,
#          dpo_v3's `onpolicy_v3` rows; 98 steps at effective batch 16
#   output and W&B run name
# The final checkpoint, step 98, is the one audited, declared before training
# (docs/V3_NEW_DATA.md, round 2).
#   HBM_COST_ARM=dpo_v3 REPO=$PWD \
#   CONFIG=configs/mitigation/dpo/qwen3.5-9b_en_only_dpo_v3_onpolicy_gh200.yaml \
#     scripts/cscs/submit.sh -p normal -t 01:30:00 scripts/cscs/train_dpo.sbatch
stage: dpo
objective: dpo
data_kind: dpo_v3_onpolicy
base_model: Qwen/Qwen3.5-9B
sft_checkpoint: outputs/sft/qwen3.5-9b_en_only_sft_v3_additional
data_config: configs/data/en_only_dpo_v3_onpolicy.yaml
output_dir: outputs/dpo/qwen3.5-9b_en_only_dpo_v3_onpolicy
use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
beta: 0.3                      # as r2em
loss_type:
- sigmoid
- sft
loss_weights:
- 1.0
- 0.2
precompute_ref_log_probs: false
max_seq_len: 3072
max_prompt_len: 2944           # read only by a TRL that still has max_prompt_length
num_train_epochs: 1
max_steps: -1                  # one epoch
warmup_steps: 10
learning_rate: 5.0e-05
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 4        # x 4 GPUs x batch 1 = 16
gradient_checkpointing: true
weight_decay: 0.01
dtype: bfloat16
seed: 42
eval_steps: 25
eval_limit_rows: 200
early_stopping_patience: 0
memory_floor_gb: 12
wandb_project: hiring-bias-mitigation
wandb_run_name: dpo-qwen3.5-9b_en_only_dpo_v3_onpolicy
decision_eval_rows: 64
resume: true
save_steps: 25
save_total_limit: 20
load_best_model_at_end: false
ddp_find_unused_parameters: false
gradient_checkpointing_kwargs:
  use_reentrant: false
