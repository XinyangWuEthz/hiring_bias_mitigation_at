# Hand-written -- NOT produced by generate_experiment_configs.py, so it survives a regeneration.
#
# SFT-v3 stage 2 candidate: SFT v1's recipe (configs/mitigation/sft/qwen3.5-9b_en_only.yaml) on the
# vote anchors' `swap` data (configs/data/en_only_sft_v3_swap.yaml). Against SFT v1 only the data
# view, output_dir and run name change, plus one placement change: Daint trains on four GPUs under
# DDP, so 4 x 1 x 4 keeps v1's effective batch of 16 (v1: one GPU, accumulation 16). Whether that
# matches the control -- the user's reproduction of SFT v1 -- is unconfirmed; align it with how the
# control ran before training. Stage 2 is not approved (docs/SFT_V3_ANCHORS.md).
#   CONFIG=configs/mitigation/sft/qwen3.5-9b_en_only_sft_v3_swap_gh200.yaml \
#     scripts/cscs/submit.sh -p debug -t 00:30:00 scripts/cscs/train_sft.sbatch
stage: sft
base_model: Qwen/Qwen3.5-9B
data_config: configs/data/en_only_sft_v3_swap.yaml
output_dir: outputs/sft/qwen3.5-9b_en_only_sft_v3_swap
use_lora: true
lora_r: 32
lora_alpha: 64
max_seq_len: 2048
num_train_epochs: 2
learning_rate: 0.0001
per_device_train_batch_size: 1
gradient_accumulation_steps: 4        # x 4 GPUs x batch 1 = 16, as v1's 1 x 1 x 16
gradient_checkpointing: false
dtype: bfloat16
seed: 42
wandb_project: hiring-bias-mitigation
wandb_run_name: sft-qwen3.5-9b_en_only_sft_v3_swap
