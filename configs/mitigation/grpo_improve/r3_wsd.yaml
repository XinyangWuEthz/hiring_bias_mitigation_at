# Hand-written -- NOT produced by generate_experiment_configs.py.
#
# GRPO-improve R3, a full epoch with the learning rate decayed over the last 146 steps
# (docs/GRPO_IMPROVE.md, round 3). GRPO-v3-all's config, seed 42 and every other setting
# unchanged, except: warmup_stable_decay (3e-5 to step 425, linear to 0 at step 571, the
# epoch's end) instead of constant_with_warmup; resume true (a fresh directory; lets one resubmission finish after a time limit). The audited checkpoint is the
# final adapter, step 571, declared before training.
#   HBM_COST_ARM=grpo_improve REPO=$PWD CONFIG=configs/mitigation/grpo_improve/r3_wsd.yaml \
#     scripts/cscs/submit.sh -p normal -t 07:30:00 scripts/cscs/train_grpo.sbatch
stage: grpo
objective: grpo
data_kind: grpo
base_model: Qwen/Qwen3.5-9B
sft_checkpoint: outputs/sft/qwen3.5-9b_en_only_sft_v3_additional
data_config: configs/data/en_only_grpo_v3_all.yaml
output_dir: outputs/grpo/grpo_improve_r3_wsd
chat_template_kwargs:
  enable_thinking: false
use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0              # dropout makes the policy's log-probs noisy against vLLM's
disable_dropout: true
# GRPO
beta: 0.04                     # KL to SFT-v3 (the adapter disabled)
num_generations: 16
temperature: 1.0
top_p: 1.0
max_completion_length: 96      # SFT answers are ~40 tokens of JSON
use_vllm: true
vllm_mode: colocate
vllm_gpu_memory_utilization: 0.30   # of 95.6 GiB; the policy and its optimizer take ~30 GB
vllm_max_model_length: 4096         # longest prompt ~2.5k tokens, plus 96
vllm_engine_kwargs:
  gdn_prefill_backend: triton       # no CUDA toolkit on Daint for FlashInfer's JIT
  # Text prompts only: no vision-encoder profiling at start-up, where job 5065963 died
  # (CUDA illegal memory access in profile_encoder_cache on rank 0, before any training).
  language_model_only: true
log_completions: false
# Optimisation: 8 completions per GPU per micro-step x 4 GPUs x 8 accumulation = 256
# completions = 16 prompts x 16 per step, GRPO-v3's 16 prompts per step.
num_train_epochs: 1
max_steps: -1
learning_rate: 3.0e-05
lr_scheduler_type: warmup_stable_decay
lr_scheduler_kwargs:
  num_decay_steps: 146          # 425 -> 571: stable to step 425, then linear to 0
  decay_type: linear
warmup_steps: 5
per_device_train_batch_size: 8
gradient_accumulation_steps: 8
gradient_checkpointing: true
weight_decay: 0.0
dtype: bfloat16
seed: 42
logging_steps: 1
memory_floor_gb: 12
wandb_project: hiring-bias-mitigation
wandb_run_name: grpo-improve-r3-wsd
# Is vLLM serving the policy? HF + PEFT margins against vLLM's on 256 held-out prompts when a
# segment starts and every 50 steps (mitigation/grpo.py, SyncValidationCallback).
sync_validate_rows: 256
sync_validate_steps: 50
# Greedy decisions on 256 held-out prompts every 25 steps; stop when the projected benchmark
# hire rate leaves 15-35%. Projection: each reference side's hire rate relative to SFT-v3's on
# the same rows, times SFT-v3's benchmark rate on that side (mitigation/grpo.py,
# projected_hire_rate; reports/reference_metrics.csv, tpr/fpr_vs_gpt4o_pct).
decision_eval_rows: 256
decision_eval_steps: 25
hire_rate_band: [0.15, 0.35]
sft_benchmark:
  hire_rate_ref_hire: 0.5773
  hire_rate_ref_reject: 0.05266
resume: true
save_steps: 25
save_total_limit: 20
ddp_find_unused_parameters: false
gradient_checkpointing_kwargs:
  use_reentrant: false
