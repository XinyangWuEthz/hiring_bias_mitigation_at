# Hand-written; not produced by generate_experiment_configs.py.
# PREPARED_UNVALIDATED_NO_TRAINING. Not in any runner; frozen policy blocks optimization.
# Candidate 8 pp direct-dev stop line, not yet validated to protect the full benchmark.
# Historical checkpoint verdicts retain the original 10 pp guardrail.
# Final threshold interpretation follows the inference-only checkpoint trajectory review.
# Same original binary prompt, 9,140 training rows, SFT-v3 parent, objective and optimizer
# as qwen3.5-9b_en_only_grpo_v3_all_gh200.yaml. Only monitoring and run identity change.
# Full benchmark was previously inspected. The remaining split is not an untouched test.
stage: grpo
objective: grpo
data_kind: grpo
base_model: Qwen/Qwen3.5-9B
sft_checkpoint: outputs/sft/qwen3.5-9b_en_only_sft_v3_additional
data_config: configs/data/en_only_grpo_v3_all.yaml
output_dir: outputs/grpo/qwen3.5-9b_en_only_grpo_v3_all_benchmark_dev_v1
chat_template_kwargs:
  enable_thinking: false
use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0              # dropout makes the policy's log-probs noisy against vLLM's
disable_dropout: true
# GRPO
beta: 0.04                     # KL to SFT-v3 (the adapter disabled)
num_generations: 16
temperature: 1.0
top_p: 1.0
max_completion_length: 96      # SFT answers are ~40 tokens of JSON
use_vllm: true
vllm_mode: colocate
vllm_gpu_memory_utilization: 0.30   # of 95.6 GiB; the policy and its optimizer take ~30 GB
vllm_max_model_length: 4096         # longest prompt ~2.5k tokens, plus 96
vllm_engine_kwargs:
  gdn_prefill_backend: triton       # no CUDA toolkit on Daint for FlashInfer's JIT
  # Text prompts only: no vision-encoder profiling at start-up, where job 5065963 died
  # (CUDA illegal memory access in profile_encoder_cache on rank 0, before any training).
  language_model_only: true
log_completions: false
# Optimisation: 8 completions per GPU per micro-step x 4 GPUs x 8 accumulation = 256
# completions = 16 prompts x 16 per step, GRPO-v3's 16 prompts per step.
num_train_epochs: 1
max_steps: -1
learning_rate: 3.0e-05
lr_scheduler_type: constant_with_warmup
warmup_steps: 5
per_device_train_batch_size: 8
gradient_accumulation_steps: 8
gradient_checkpointing: true
weight_decay: 0.0
dtype: bfloat16
seed: 42
logging_steps: 1
memory_floor_gb: 12
wandb_project: hiring-bias-mitigation
wandb_run_name: grpo-qwen3.5-9b_en_only_grpo_v3_all_benchmark_dev_v1
# Is vLLM serving the policy? HF + PEFT margins against vLLM's on 256 held-out prompts when a
# segment starts and every 50 steps (mitigation/grpo.py, SyncValidationCallback).
sync_validate_rows: 256
sync_validate_steps: 50
# Direct binary TPR on frozen original-label benchmark-dev hire rows. No projection.
# The separate sync-validation callback above remains enabled.
benchmark_dev_monitor:
  manifest_file: outputs/benchmark_dev_monitor_v1/manifest.json
  manifest_sha256: e8d073849e56ed9b35ccf8f29d370e1e333d62c47ef947187addf281e489d2f7
  steps: 25
  tpr_drop_stop: 0.08
resume: true
save_steps: 25
save_total_limit: 20
ddp_find_unused_parameters: false
gradient_checkpointing_kwargs:
  use_reentrant: false
